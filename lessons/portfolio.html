<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./header.css">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="header">
        <div class="right-section">
            <p class="logo">LucaDCZ <span class="dot">.</span></p>
        </div>
        <div class="middle-section">
            <p>Home</p>
            <p>Projects</p>
            <p>About</p>
        </div>
        <div class="left-section">
            <img class="chat-icon" src="./chat.svg" alt="chat">
        </div>
    </div>

    <div class="main-section">
        <div class="dev-info">
            <p class="greetings">Hey,I'm Luca &#128075;</p>
            <p class="role"><span class="front-span">Front</span>end Developer</p>
            <p class="description">I'm a frontend developer based in italy, i'll help you build beautiful website your
                users will love.</p>
                
            <div class="button-container">
                <button class="get-in-touch">Get In Touch</button>

                <button class="browse-projects">Browse Projects</button>
            </div>
        </div>
        <div class="dev-img-container">
            <img class="hero-img" src="./profile.png" alt="profile">
        </div>
    </div>
</body>

</html>
